version: '3.8'
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: smart_budget
      POSTGRES_USER: smart_budget_user
      POSTGRES_PASSWORD: smart_budget_12345
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smart-budget-api
      DB_USER: smart_budget_user
      DB_PASS: smart_budget_12345
    depends_on:
      - db
    ports:
      - "3000:3000"
volumes:
  db_data:
